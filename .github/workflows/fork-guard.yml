name: fork-guard

# jazmf-dx/video-studio is hamirilo/video-studio (upstream) plus the work edition's
# own files (docs/CORP.md). Every other file stays as upstream has it, so
# merging upstream never conflicts. This fails a pull request that changes
# anything else: make that change in upstream and merge it in instead.
on:
  pull_request:
    branches: [main]

jobs:
  only-corp-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Files that differ from the upstream this branch is based on
        run: |
          git fetch --quiet https://github.com/hamirilo/video-studio main
          # The last upstream commit merged in: what this branch should equal
          # apart from the work edition's files.
          base=$(git merge-base FETCH_HEAD HEAD)
          # The work edition's own files (docs/CORP.md, "社内版だけのファイル").
          allowed='^(\.github/workflows/corp\.yml|\.github/workflows/fork-guard\.yml|src-tauri/tauri\.corp\.conf\.json|docs/CORP\.md)$'
          extra=$(git diff --name-only "$base" HEAD | grep -Ev "$allowed" || true)
          if [ -n "$extra" ]; then
            echo "::error::upstream（hamirilo/video-studio）と同じであるべきファイルが変わっています。変更は upstream に入れてから取り込んでください（docs/CORP.md）"
            echo "$extra" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: upstream との差は社内版のファイルだけです"
